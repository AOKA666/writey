# writey Workers: preview (default) and production ([env.production]).
# Tech stack is Cloudflare-first but still [待确认].
# Do not put secrets here. Do not bind a custom domain in this file.

# Default / preview Worker. Keep SITE_URL empty so preview stays noindex
# and does not invent canonicals. Do not set SITE_URL to the production
# domain or to a workers.dev / pages.dev host.
name = "writey-preview"
main = "worker/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
# Intercept first so 301/308, /api, sitemap, robots, and HTTP 404 work.
run_worker_first = true
# Serve prerendered files at their exact paths (/index.html, /pricing/index.html).
# The default auto-trailing-slash handling redirected /index.html -> / and
# produced an empty 200 when the worker rewrote the path.
html_handling = "none"

# Public, non-secret config.
[vars]
SITE_URL = ""

# Preview D1 only. Never point the preview Worker at the production database.
[[d1_databases]]
binding = "DB"
database_name = "writey-preview"
database_id = "4c3a2341-993a-4ed5-9e4e-67c48d9c912f"
migrations_dir = "migrations"

# Production Worker (separate name + D1). Deploy with:
#   npm run build:production
#   npx wrangler deploy --env production
# Environments do not always inherit, so assets, compatibility, vars, and D1
# are restated here. Do not deploy from this repository without operator action.
[env.production]
name = "writey"
main = "worker/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[env.production.vars]
SITE_URL = "https://text2handwriting.site"

[[env.production.d1_databases]]
binding = "DB"
database_name = "writey"
database_id = "10ef8a67-714f-4e6a-8037-9193085be4c4"
migrations_dir = "migrations"
